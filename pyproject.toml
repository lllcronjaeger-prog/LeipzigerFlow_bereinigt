[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leipzigerflow"
version = "2026.19.4"
description = "LeipzigerFlow - Dispositionssoftware"
requires-python = ">=3.14"

dependencies = [
    "PySide6>=6.11",
    "psycopg[binary]>=3.2",
    "SQLAlchemy>=2.0",
    "openpyxl>=3.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]